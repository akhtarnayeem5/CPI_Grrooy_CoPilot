<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>Welcome to CPI Groovy Chrome Extension</h2>
        <span class="badge">Gemini 2.5</span>
    </div>
    <label for="requirement">Describe your requirement:</label>
    <textarea id="requirement" placeholder="Enter your requirement here..."></textarea>
    <button id="generateBtn" class="primary-btn">Generate Groovy Script</button>
    <div id="status" class="status"></div>
    <div id="outputSection" class="hidden">
        <div class="toolbar">
            <button id="copyBtn" class="secondary-btn">Copy Groovy only</button>
            <button id="injectBtn" class="accent-btn">inject into CPI editor</button>
        </div>
        <pre id="codePreview" class="output"></pre>
    </div>
    <script src="popup.js"></script>
</body>
</html>
